name: test

on:
  push:
  pull_request:

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and integration tests
        run: npm test
      - name: Isolated end-to-end verification
        run: npm run verify -- --out "$RUNNER_TEMP/enterprise-learning-e2e.json"
